name: CD

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_REF_NAME
          script: |
            set -e
            APP_DIR="/var/www/forum-api/forum-api-dicoding"
            PM2_APP_NAME="forum-api"
            BRANCH="${GITHUB_REF_NAME:-main}"

            cd "$APP_DIR"
            git fetch --all
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm install
            npm run migrate -- up
            pm2 reload "$PM2_APP_NAME" || pm2 start src/app.js --name "$PM2_APP_NAME"