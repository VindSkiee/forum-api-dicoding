name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: arvind
      PGPASSWORD: admin
      PGDATABASE: forumapi_test
      DATABASE_URL: postgresql://arvind:admin@localhost:5432/forumapi_test
      ACCESS_TOKEN_KEY: test_access_token_key
      REFRESH_TOKEN_KEY: test_refresh_token_key
      ACCESS_TOKEN_AGE: 3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arvind
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvind -d forumapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test env file
        run: |
          cat <<EOF > .test.env
          PGHOST=${PGHOST}
          PGPORT=${PGPORT}
          PGUSER=${PGUSER}
          PGPASSWORD=${PGPASSWORD}
          PGDATABASE=${PGDATABASE}
          DATABASE_URL=${DATABASE_URL}
          ACCESS_TOKEN_KEY=${ACCESS_TOKEN_KEY}
          REFRESH_TOKEN_KEY=${REFRESH_TOKEN_KEY}
          ACCESS_TOKEN_AGE=${ACCESS_TOKEN_AGE}
          EOF

      - name: Run migrations
        run: npm run migrate:test -- up

      - name: Run tests
        run: npm test
